<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>로그릿</title>
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" href="./icon.png">
<link rel="apple-touch-icon" href="./icon.png">
<link rel="manifest" href="manifest.json">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&display=swap');
:root{--bg-color:#000;--card-bg:#111;--modal-bg:#18181b;--nav-bg:rgba(24,24,27,.85);--text-main:#94a3b8;--text-bold:#fff;--border-color:rgba(255,255,255,.08);--brand-color:#818cf8;--calendar-border:rgba(255,255,255,.08);--sun-color:#ff4d4d;--sat-color:#4d94ff;--input-bg:rgba(255,255,255,.05);--sub-bg:rgba(255,255,255,.05)}
body.light-mode{--bg-color:#f8fafc;--card-bg:#fff;--modal-bg:#fff;--nav-bg:rgba(255,255,255,.85);--text-main:#64748b;--text-bold:#0f172a;--border-color:rgba(0,0,0,.08);--brand-color:#4f46e5;--calendar-border:#e2e8f0;--input-bg:#f1f5f9;--sub-bg:#f1f5f9}
body{font-family:'Pretendard',sans-serif;background:var(--bg-color);color:var(--text-main);margin:0;text-align:left;overflow-x:hidden;-webkit-tap-highlight-color:transparent;user-select:none}.text-important{color:var(--text-bold)!important}.text-dim{color:var(--text-main)}.bg-card{background:var(--card-bg)}.bg-modal{background:var(--modal-bg)}.bg-sub{background:var(--sub-bg)}.bg-nav{background:var(--nav-bg)}.bg-brand{background:var(--brand-color);color:#fff}.border-custom{border-color:var(--border-color)}
.fixed-header{position:fixed;top:0;left:0;right:0;height:56px;z-index:100;background:var(--nav-bg);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--border-color)}.sticky-sub{position:sticky;top:56px;z-index:45;background:var(--bg-color);width:100%;border-bottom:1px solid var(--calendar-border)}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);width:100vw}.memo-cell{min-height:115px;border-right:.5px solid var(--calendar-border);border-bottom:.5px solid var(--calendar-border);overflow:hidden}.date-num{font-size:16px;font-weight:800;width:28px;height:28px;display:flex;align-items:center;justify-content:center;margin:2px auto 0}.is-today .date-num{background:var(--brand-color);color:#fff;border-radius:50%}.memo-strip{font-size:11.5px;padding:2px 4px;white-space:nowrap;overflow:hidden}.sun{color:var(--sun-color)!important}.sat{color:var(--sat-color)!important}.input-field{width:100%;background:var(--input-bg);border:1.5px solid var(--border-color);border-radius:14px;padding:16px;color:var(--text-bold);outline:none;font-size:16px;font-weight:bold}.btn-primary{width:100%;background:var(--brand-color);color:#fff;padding:18px;border-radius:14px;font-weight:900}.no-scrollbar::-webkit-scrollbar{display:none}
</style>
</head>
<body class="pb-40 no-scrollbar">
<div class="fixed-header"><div class="flex items-center gap-2"><div class="w-8 h-8 bg-brand flex items-center justify-center text-white font-black text-xl rounded-lg">L</div><div class="flex flex-col"><span class="font-bold text-important">로그릿</span><span class="text-[8px] font-bold" style="color:var(--brand-color)">PREVIEW</span></div></div><div class="flex gap-2"><button onclick="goToToday()" class="px-3 h-8 bg-brand text-[12px] font-bold rounded-lg">오늘</button><button onclick="openSettings()" class="w-8 h-8"><i data-lucide="settings"></i></button></div></div>
<div id="app-view" class="w-full mx-auto pt-14 min-h-screen"></div>
<nav class="fixed bottom-6 left-4 right-4 bg-nav border border-custom h-16 flex justify-around items-center z-[60] rounded-2xl"><button onclick="navTo('e_cal')" id="nav-e_cal" class="flex flex-col items-center"><i data-lucide="calendar"></i><span class="text-[10px]">일정</span></button><button onclick="navTo('list')" id="nav-list" class="flex flex-col items-center"><i data-lucide="clipboard-list"></i><span class="text-[10px]">기록</span></button><button onclick="navTo('s_cal')" id="nav-s_cal" class="flex flex-col items-center"><i data-lucide="trending-up"></i><span class="text-[10px]">매출</span></button><button onclick="navTo('home')" id="nav-home" class="flex flex-col items-center"><i data-lucide="layout-grid"></i><span class="text-[10px]">홈</span></button></nav>
<button onclick="openEntryModal()" class="fixed right-5 bottom-24 w-16 h-16 bg-brand rounded-3xl z-[60] flex items-center justify-center"><i data-lucide="plus" class="text-white"></i></button>
<script>
const STORAGE_KEY='logrit_v130_master_storage';let db=[];try{db=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}catch(e){}let currentNav='e_cal',calContext=new Date(),selectedDate=null;
const fmt=v=>new Intl.NumberFormat('ko-KR').format(v||0);const today=()=>{const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')};const sort=a=>[...a].sort((x,y)=>x.date.localeCompare(y.date)||(x.time||'').localeCompare(y.time||''));
function sync(){localStorage.setItem(STORAGE_KEY,JSON.stringify(db));render()}function navTo(n){currentNav=n;render();scrollTo(0,0)}function openSettings(){currentNav='settings';render()}function goToToday(){calContext=new Date();currentNav='e_cal';render()}
function render(){const root=document.getElementById('app-view'),p=calContext.getFullYear()+'-'+String(calContext.getMonth()+1).padStart(2,'0');
if(currentNav==='e_cal'){const y=calContext.getFullYear(),m=calContext.getMonth(),start=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();let g='';for(let i=0;i<start;i++)g+='<div class="memo-cell"></div>';for(let d=1;d<=last;d++){const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),items=sort(db.filter(x=>x.date===ds));g+='<div onclick="openEntryModal(null,\''+ds+'\')" class="memo-cell '+(ds===today()?'is-today':'')+'"><div class="date-num '+(((start+d-1)%7===0)?'sun':((start+d-1)%7===6?'sat':''))+'">'+d+'</div>'+items.map(x=>'<div class="memo-strip">'+(x.time||'')+' '+(x.supplier||x.note||'')+'</div>').join('')+'</div>'}root.innerHTML='<div class="sticky-sub px-5 py-5"><h2 class="text-3xl font-black text-important">'+(m+1)+'월</h2><div class="grid grid-cols-7 text-center text-xs mt-4"><div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div></div></div><div class="calendar-grid">'+g+'</div>'}
else if(currentNav==='list'){root.innerHTML='<div class="p-5 text-important"><h2 class="text-2xl font-black mb-6">기록 리스트</h2>'+sort(db).map(x=>'<div class="bg-card p-5 rounded-3xl mb-3 border border-custom"><b>'+x.date+' '+(x.time||'')+'</b><p class="text-xl">'+(x.note||'일정 기록')+'</p><span>'+(x.supplier||'')+' '+(x.amount?fmt(x.amount)+'원':'')+'</span></div>').join('')+'</div>'}
else if(currentNav==='s_cal'){const a=db.filter(x=>x.date.startsWith(p)),sum=a.reduce((s,x)=>s+Number(x.amount||0),0);root.innerHTML='<div class="p-6 text-important"><h2 class="text-4xl font-black">'+fmt(sum)+'원</h2><p>'+p+' / '+a.length+'건</p></div>'}
else if(currentNav==='home'){const a=db.filter(x=>x.date===today()),sum=db.filter(x=>x.date.startsWith(p)).reduce((s,x)=>s+Number(x.amount||0),0);root.innerHTML='<div class="p-5 text-important"><div class="bg-modal p-8 rounded-[2.5rem]"><p>Monthly Total Rev</p><h2 class="text-5xl font-black">'+fmt(sum)+'원</h2><p class="mt-8">오늘 일정</p><b class="text-3xl" style="color:var(--brand-color)">'+a.length+'건</b></div></div>'}
else root.innerHTML='<div class="p-6 text-important"><h2 class="text-3xl font-black">시스템 설정</h2><p class="mt-6">프리뷰 버전입니다. 데이터는 이 브라우저 안에 저장됩니다.</p><button onclick="if(confirm(\'모든 데이터를 삭제할까요?\')){db=[];sync()}" class="mt-8 p-4 text-red-500">전체 데이터 초기화</button></div>';if(window.lucide)lucide.createIcons()}
function openEntryModal(id=null,preset=null){const date=preset||today();document.body.insertAdjacentHTML('beforeend','<div id="modal" class="fixed inset-0 bg-black/70 z-[200] flex items-end"><div class="bg-modal w-full p-7 rounded-t-[2.5rem] text-important"><h3 class="text-2xl font-black mb-5">일정 기록</h3><form onsubmit="saveRecord(event)"><input id="d" type="date" class="input-field mb-3" value="'+date+'" required><input id="t" class="input-field mb-3" placeholder="시간 예: 07:10"><input id="s" class="input-field mb-3" placeholder="거래처명"><input id="a" type="number" class="input-field mb-3" placeholder="매출 금액"><textarea id="n" class="input-field mb-4" placeholder="상세 메모"></textarea><button class="btn-primary">저장하기</button><button type="button" onclick="document.getElementById(\'modal\').remove()" class="w-full p-4 mt-2">닫기</button></form></div></div>')}
function saveRecord(e){e.preventDefault();db.push({id:String(Date.now()),date:d.value,time:t.value,supplier:s.value||'미지정',amount:Number(a.value||0),note:n.value||'내용없음'});document.getElementById('modal').remove();sync()}window.onload=render;
</script></body></html>
