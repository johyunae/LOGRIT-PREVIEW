<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>로그릿 Preview</title><meta name="theme-color" content="#000000"><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icon.svg"><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script></head>
<body class="bg-black text-white min-h-screen pb-32">
<header class="sticky top-0 z-50 bg-black/90 backdrop-blur border-b border-white/10 p-4 flex justify-between"><div><b class="text-xl">로그릿</b><div class="text-[10px] text-indigo-400">PREVIEW · 원본과 데이터 분리</div></div><button onclick="settings()" class="p-2"><i data-lucide="settings"></i></button></header>
<main id="app" class="p-4"></main>
<nav class="fixed bottom-5 left-4 right-4 h-16 bg-zinc-900/95 border border-white/10 rounded-2xl flex justify-around items-center"><button onclick="nav('cal')">일정</button><button onclick="nav('list')">기록</button><button onclick="nav('sales')">매출</button><button onclick="nav('home')">홈</button></nav>
<button onclick="edit()" class="fixed right-6 bottom-24 w-16 h-16 rounded-3xl bg-indigo-500 text-3xl">+</button>
<input id="restore" type="file" accept=".json" hidden onchange="restoreData(event)">
<script>
const STORAGE_KEY='logrit_preview_v1_storage';let db=[];try{db=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');if(!Array.isArray(db))db=[]}catch(e){db=[]}let view='cal',month=new Date();
const day=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},money=n=>new Intl.NumberFormat('ko-KR').format(Number(n)||0),sort=a=>[...a].sort((x,y)=>(x.date||'').localeCompare(y.date||'')||(x.time||'').localeCompare(y.time||''));
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(db));render()}function nav(v){view=v;render();scrollTo(0,0)}
function card(x){return '<div class="bg-zinc-900 border border-white/10 rounded-2xl p-4 mb-3" onclick="edit(\''+x.id+'\')"><div class="text-indigo-400 font-bold">'+x.date+' '+(x.time||'')+'</div><div class="text-xl font-black mt-2">'+(x.note||'일정 기록')+'</div><div class="text-slate-400 mt-2">'+(x.supplier||'')+(x.amount?' · '+money(x.amount)+'원':'')+'</div></div>'}
function render(){let a=document.getElementById('app'),p=month.getFullYear()+'-'+String(month.getMonth()+1).padStart(2,'0');if(view==='list')a.innerHTML='<h2 class="text-2xl font-black mb-5">기록 리스트</h2>'+sort(db).map(card).join('');else if(view==='sales'){let x=db.filter(v=>(v.date||'').startsWith(p)),s=x.reduce((n,v)=>n+Number(v.amount||0),0);a.innerHTML='<h2 class="text-4xl font-black">'+money(s)+'원</h2><p class="text-slate-400 mt-2">'+p+' · '+x.length+'건</p>'}else if(view==='home'){let x=db.filter(v=>v.date===day()),s=db.filter(v=>(v.date||'').startsWith(p)).reduce((n,v)=>n+Number(v.amount||0),0);a.innerHTML='<div class="bg-zinc-900 rounded-3xl p-7"><div class="text-slate-400">Monthly Total Rev</div><div class="text-4xl font-black mt-2">'+money(s)+'원</div><div class="mt-8 text-slate-400">오늘 일정</div><div class="text-3xl font-black text-indigo-400">'+x.length+'건</div></div>'}else{let y=month.getFullYear(),m=month.getMonth(),st=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate(),g='';for(let i=0;i<st;i++)g+='<div></div>';for(let d=1;d<=last;d++){let ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),n=db.filter(x=>x.date===ds).length;g+='<button onclick="edit(null,\''+ds+'\')" class="min-h-20 border border-white/10 rounded-lg p-1"><b>'+d+'</b>'+(n?'<div class="text-xs text-indigo-400">'+n+'건</div>':'')+'</button>'}a.innerHTML='<div class="flex justify-between items-center mb-4"><button onclick="move(-1)">‹</button><h2 class="text-3xl font-black">'+(m+1)+'월</h2><button onclick="move(1)">›</button></div><div class="grid grid-cols-7 gap-1 text-center text-xs text-slate-500 mb-2"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div class="grid grid-cols-7 gap-1">'+g+'</div>'}lucide.createIcons()}
function move(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);render()}
function edit(id=null,preset=null){let x=id?db.find(v=>String(v.id)===String(id)):null,ds=preset||(x&&x.date)||day();document.body.insertAdjacentHTML('beforeend','<div id="modal" class="fixed inset-0 z-[100] bg-black/80 flex items-end"><form onsubmit="record(event,\''+(id||'')+'\')" class="bg-zinc-900 w-full rounded-t-3xl p-6"><h2 class="text-2xl font-black mb-4">일정 기록</h2><input id="d" type="date" value="'+ds+'" class="w-full p-4 mb-2 bg-zinc-800 rounded-xl"><input id="t" value="'+(x?.time||'')+'" placeholder="시간" class="w-full p-4 mb-2 bg-zinc-800 rounded-xl"><input id="s" value="'+(x?.supplier||'')+'" placeholder="거래처" class="w-full p-4 mb-2 bg-zinc-800 rounded-xl"><input id="amt" value="'+(x?.amount||'')+'" type="number" placeholder="매출" class="w-full p-4 mb-2 bg-zinc-800 rounded-xl"><textarea id="note" placeholder="메모" class="w-full p-4 mb-3 bg-zinc-800 rounded-xl">'+(x?.note||'')+'</textarea><button class="w-full p-4 bg-indigo-500 rounded-xl font-black">저장</button><button type="button" onclick="modal.remove()" class="w-full p-4">닫기</button></form></div>')}
function record(e,id){e.preventDefault();let x={id:id||String(Date.now()),date:d.value,time:t.value,supplier:s.value||'미지정',amount:Number(amt.value||0),note:note.value||'내용없음'};db=id?db.map(v=>String(v.id)===id?x:v):[...db,x];modal.remove();save()}
function settings(){document.body.insertAdjacentHTML('beforeend','<div id="set" class="fixed inset-0 z-[100] bg-black/80 flex items-end"><div class="bg-zinc-900 w-full rounded-t-3xl p-6"><h2 class="text-2xl font-black mb-2">데이터 관리</h2><p class="text-sm text-slate-400 mb-5">프리뷰는 원본과 다른 저장공간을 사용합니다. 원본 기록은 자동으로 변경되지 않습니다.</p><button onclick="restore.click()" class="w-full p-4 mb-3 bg-indigo-500 rounded-xl font-black">로그릿 백업 JSON 복원</button><button onclick="backup()" class="w-full p-4 mb-3 bg-zinc-800 rounded-xl font-bold">프리뷰 데이터 백업</button><button onclick="set.remove()" class="w-full p-4">닫기</button></div></div>')}
function restoreData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x))throw 0;if(!confirm(x.length+'건을 프리뷰로 복원할까요? 기존 프리뷰 기록은 교체됩니다.'))return;db=x;save();set?.remove();alert('프리뷰 복원 완료: '+x.length+'건')}catch(_){alert('올바른 로그릿 백업 JSON 파일이 아닙니다.')}};r.readAsText(f);e.target.value=''}
function backup(){let a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(db));a.download='logrit_preview_backup_'+day()+'.json';a.click()}if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.error))}window.onload=render;
</script></body></html>
